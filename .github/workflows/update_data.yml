name: Update Market Data

on:
  # GitHub上のボタンから手動実行
  workflow_dispatch:

  # 平日の日本時間6時に自動実行
  schedule:
    - cron: "0 21 * * 1-5"

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Show current data.json
        run: |
          if [ -f data.json ]; then
            cat data.json
          else
            echo "data.json does not exist"
          fi

      - name: Update market data
        run: python -u scripts/update_data.py

      - name: Show updated data.json
        if: always()
        run: |
          if [ -f data.json ]; then
            cat data.json
          else
            echo "data.json does not exist"
          fi

      - name: Commit and push changes
        if: success()
        run: |
          if git diff --quiet -- data.json; then
            echo "No changes to data.json"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          git commit -m "Update market data"
          git push
